# ==============================================================================
# CONFIGURACIÓN SEGURA NGINX PARA ADORALASH.CL (Grado A+ SSL Labs)
# ==============================================================================

# 1. Redirección obligatoria de HTTP a HTTPS (Sin exponer tráfico plano)
server {
    listen 80;
    listen [::]:80;
    server_name adoralash.cl www.adoralash.cl;

    return 301 https://$host$request_uri;
}

# 2. Servidor Seguro HTTPS con Certificado SSL/TLS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adoralash.cl www.adoralash.cl;

    root /var/www/adoralash.cl;
    index index.html;

    # Certificados SSL (Ejemplo con Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/adoralash.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adoralash.cl/privkey.pem;

    # Protocolos seguros (Desactivar SSLv3, TLSv1.0 y TLSv1.1 obsoletos)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Optimización de Sesiones SSL
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling (Verificación rápida y segura del estado del certificado)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Cabeceras de Seguridad y Protección de Privacidad del Cliente
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; img-src 'self' https: data:; frame-ancestors 'none'; form-action 'self' https://wa.me https://api.whatsapp.com;" always;

    # Evitar acceso a archivos ocultos o de configuración
    location ~ /\. {
        deny all;
    }

    # Desactivar logs innecesarios para privacidad
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
